spring.application.name=studyflow-backend

# =========================================================
# DATABASE
# =========================================================
# Oracle Database connection
spring.datasource.url= DB_URL:jdbc:oracle:thin:@10.247.66.112:1521:XE
spring.datasource.username=SYSTEM
spring.datasource.password=274123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# =========================================================
# SERVER
# =========================================================

server.port=8080

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# GMAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================
# GEMINI AI
# =========================================================

gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.7-flash}

# =========================================================
# LIVEKIT GROUP STUDY CALLS
# =========================================================

# Keep all three values in environment variables. Never commit them.
livekit.url=${LIVEKIT_URL:}
livekit.api.key=${LIVEKIT_API_KEY:}
livekit.api.secret=${LIVEKIT_API_SECRET:}
