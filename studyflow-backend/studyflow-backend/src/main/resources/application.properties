spring.application.name=studyflow-backend

# =========================================================
# ORACLE DATABASE
# =========================================================
# Override DB_URL if your Oracle service is not XEPDB1.
# Common local service names include XEPDB1 and FREEPDB1.
# Set DB_USERNAME and DB_PASSWORD in your local environment.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:studyflow}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# For local development only. Prefer a reviewed SQL migration for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# =========================================================
# SERVER
# =========================================================
server.port=8080

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# GMAIL
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================
# GEMINI AI
# =========================================================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.7-flash}

# =========================================================
# LIVEKIT GROUP STUDY CALLS
# =========================================================
livekit.url=${LIVEKIT_URL:}
livekit.api.key=${LIVEKIT_API_KEY:}
livekit.api.secret=${LIVEKIT_API_SECRET:}
